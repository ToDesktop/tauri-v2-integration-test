name: Release
on:
  push:   # the refs step 3 trusts
    tags: ["v*"]
  workflow_dispatch:
jobs:
  release:
    strategy:
      fail-fast: false   # one platform failing doesn't cancel the others' uploads
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            args: --bundles app
          - os: macos-15
            target: x86_64-apple-darwin
            args: --bundles app
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --no-bundle
          - os: windows-latest   # cross-compiled for Windows on Arm
            target: aarch64-pc-windows-msvc
            args: --no-bundle
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --no-bundle
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write   # lets ToDesktop check the job is yours
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev
      - run: npm ci
      # Unsigned: leave APPLE_SIGNING_IDENTITY unset, ToDesktop signs it.
      - run: npx tauri build ${{ matrix.args }} --target ${{ matrix.target }}
      - id: version   # package.json's, for runs without a tag
        shell: bash
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - uses: ToDesktop/upload-action@v1   # sends the built app
        with:
          # A tag (v1.2.3) names the version; other runs use
          # package.json's, as branch names aren't versions.
          version: ${{ github.ref_type == 'tag' && github.ref_name || steps.version.outputs.version }}
